<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мои задачи</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 0 12px; }
    input, button { padding: 8px; margin: 4px 0; font-size: 15px; }
    li { margin: 6px 0; }
    #warning { display: none; background: #ffe5e5; color: #a00; padding: 10px; border-radius: 6px; }
    hr { margin: 20px 0; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h1>Мои задачи</h1>
 
  <p id="warning">
    Впишите свои Project URL и anon key в начало блока &lt;script&gt; в этом файле
    (Supabase → Project Settings → API), сохраните файл и обновите страницу.
  </p>
 
  <div id="auth">
    <input id="email" type="email" placeholder="Почта">
    <input id="password" type="password" placeholder="Пароль (от 6 символов)">
    <button onclick="signUp()">Регистрация</button>
    <button onclick="signIn()">Войти</button>
  </div>
 
  <div id="app" style="display:none">
    <p>Вы вошли как <span id="who"></span> <button onclick="signOut()">Выйти</button></p>
    <input id="task" placeholder="Новая задача">
    <button onclick="addTask()">Добавить</button>
    <ul id="list"></ul>
 
    <hr>
    <button onclick="loadStats()">Статистика</button>
    <p id="stats"></p>
 
    <input id="echoText" placeholder="Что отправить на сервер">
    <button onclick="sendEcho()">Отправить</button>
    <p id="echoResult"></p>
  </div>
 
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ТВОИ ДАННЫЕ SUPABASE
    const SUPABASE_URL = "https://nedwvthcrdalnljuxqxn.supabase.co";
    const SUPABASE_KEY = "sb_publishable_g6gSs011FB_CxED2C-ZYWA_3T7KTmNC";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
 
    // ТВОЙ АДРЕС БЭКЕНДА НА AMVERA (без слеша в конце)
    const BACKEND_URL = "https://backend-alina09156.msk1.amvera.tech";
 
    // Подсказка, если ключи ещё не вписаны
    if (SUPABASE_URL.includes("ВАШ-ПРОЕКТ") || SUPABASE_KEY.includes("ВАШ-")) {
      document.getElementById("warning").style.display = "block";
    }
 
    async function signUp() {
      const { error } = await db.auth.signUp({
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
      });
      alert(error ? "Ошибка: " + error.message : "Готово, теперь войдите");
    }
 
    async function signIn() {
      const { error } = await db.auth.signInWithPassword({
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
      });
      if (error) { alert("Ошибка: " + error.message); return; }
      showApp();
    }
 
    async function signOut() {
      await db.auth.signOut();
      location.reload();
    }
 
    async function showApp() {
      const { data: { user } } = await db.auth.getUser();
      if (!user) return;
      document.getElementById("auth").style.display = "none";
      document.getElementById("app").style.display = "block";
      document.getElementById("who").textContent = user.email;
      loadTasks();
    }
 
    async function loadTasks() {
      const { data, error } = await db.from("tasks").select("*").order("id");
      if (error) { alert(error.message); return; }
      const list = document.getElementById("list");
      list.innerHTML = "";
      for (const t of data) {
        const li = document.createElement("li");
        li.textContent = t.title + " ";
        
        // Зачеркиваем, если задача сделана
        if (t.done) {
          li.style.textDecoration = "line-through";
        }

        // Кнопка "Сделано"
        if (!t.done) {
          const btnDone = document.createElement("button");
          btnDone.textContent = "Сделано";
          btnDone.onclick = () => markDone(t.id);
          li.appendChild(btnDone);
        }

        // Кнопка удаления
        const btn = document.createElement("button");
        btn.textContent = "×";
        btn.onclick = () => deleteTask(t.id);
        li.appendChild(btn);

        list.appendChild(li);
      }
    }
 
    async function addTask() {
      const title = document.getElementById("task").value.trim();
      if (!title) return;
      const { data: { user } } = await db.auth.getUser();
      const { error } = await db.from("tasks").insert({ title, user_id: user.id });
      if (error) { alert(error.message); return; }
      document.getElementById("task").value = "";
      loadTasks();
    }

    // Функция "Сделано"
    async function markDone(id) {
      await db.from("tasks").update({ done: true }).eq("id", id);
      loadTasks();
    }
 
    async function deleteTask(id) {
      await db.from("tasks").delete().eq("id", id);
      loadTasks();
    }

    // Функция для статистики (запрос к Amvera)
    async function loadStats() {
      document.getElementById("stats").textContent = "Считаем...";
      try {
        const response = await fetch(BACKEND_URL + "/stats");
        const data = await response.json();
        document.getElementById("stats").textContent = "Всего задач в базе: " + data.total_tasks;
      } catch (e) {
        document.getElementById("stats").textContent = "Ошибка: сервер недоступен";
      }
    }

    // Функция для проверки отправки данных (echo)
    async function sendEcho() {
      const text = document.getElementById("echoText").value;
      const response = await fetch(BACKEND_URL + "/echo", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: text }),
      });
      const data = await response.json();
      document.getElementById("echoResult").textContent = JSON.stringify(data);
    }
 
    showApp(); // если уже входили раньше — сразу показываем задачи
  </script>
</body>
</html>
